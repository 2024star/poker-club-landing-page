<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c25">
  <meta name="description" content="Dy ase. Një zgjedhje. Zbulo promon 5M të Albania Poker Club.">
  <title>Raise apo All in? | Albania Poker Club</title>
  <link rel="stylesheet" href="/promo/styles.css">
  <script src="/promo/script.js" defer></script>
</head>
<body>
  <header class="header">
    <a href="/" aria-label="Albania Poker Club, faqja kryesore"><img src="/assets/apc-core.svg" width="96" height="84" alt="APC · Albania Poker Club"></a>
    <span class="edition">PROMO <span>5M</span></span>
  </header>
  <main>
    <div class="eyebrow"><span></span> ALBANIA POKER CLUB</div>
    <div class="hand" role="img" aria-label="Dy ase: asi spathi dhe asi zemër">
      <div class="card card-spade"><span class="corner">A<small>♠</small></span><span class="suit">♠</span><span class="corner bottom">A<small>♠</small></span></div>
      <div class="card card-heart"><span class="corner">A<small>♥</small></span><span class="suit">♥</span><span class="corner bottom">A<small>♥</small></span></div>
      <div class="chip" aria-hidden="true"><span>APC<br><strong>5M</strong></span></div>
    </div>
    <section class="decision" aria-labelledby="question">
      <p class="kicker">DY ASE. NJË ZGJEDHJE.</p>
      <h1 id="question">Raise apo <em>All in?</em></h1>
      <p class="intro">Ti i ke letrat. Cila është lëvizja jote?</p>
      <div class="actions" aria-label="Zgjidh lëvizjen">
        <button type="button" data-choice="raise" aria-controls="promo-result" aria-expanded="false">Raise <span aria-hidden="true">↗</span></button>
        <button type="button" class="all-in" data-choice="all-in" aria-controls="promo-result" aria-expanded="false">All in <span aria-hidden="true">♠</span></button>
      </div>
      <div id="promo-result" class="result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden>
        <span class="result-label">TURNEU <strong>5M</strong></span>
        <p>Duke paraqitur kete Chips qe ke ne dore, mund te marash pjese ne turneun 5M</p>
      </div>
      <noscript><p class="noscript">Duke paraqitur kete Chips qe ke ne dore, mund te marash pjese ne turneun 5M</p></noscript>
    </section>
  </main>
  <footer><span>ALBANIA POKER CLUB</span><span>Tiranë, Shqipëri</span></footer>
</body>
</html>
